name: format-check

on: [ push ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: DoozyX/clang-format-lint-action@c71d0bf4e21876ebec3e5647491186f8797fde31 # v0.16.2
        with:
          source: 'p4-fusion tests'
          extensions: 'h,cc'
          clangFormatVersion: 14
